services:
  postgres:
    image: postgres:16-alpine
    container_name: gophprofile-postgres
    environment:
      POSTGRES_DB: gophprofile
      POSTGRES_USER: gophprofile
      POSTGRES_PASSWORD: gophprofile
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophprofile -d gophprofile"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: gophprofile-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gophprofile-rabbitmq
    ports:
      - "5673:5672"       # AMQP: снаружи 5673 → внутри 5672
      - "15673:15672"     # Management UI: снаружи 15673 → внутри 15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: gophprofile-jaeger
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"   
    
    
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gophprofile-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle' 
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: gophprofile-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  grafana:
    image: grafana/grafana:11.3.0
    container_name: gophprofile-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: gophprofile-opensearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: gophprofile-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy

  fluent-bit:
    image: fluent/fluent-bit:3.0
    container_name: gophprofile-fluent-bit
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./deploy/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./deploy/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    depends_on:
      opensearch:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: gophprofile-server
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      jaeger:   { condition: service_started }
    environment:
      DB_DSN:        postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable
      S3_ENDPOINT:   minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET:     avatars
      AMQP_URL:      amqp://guest:guest@rabbitmq:5672/
      HTTP_ADDR:     ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: gophprofile-worker
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      jaeger:   { condition: service_started }
    environment:
      DB_DSN:        postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable
      S3_ENDPOINT:   minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET:     avatars
      AMQP_URL:      amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8081:8081"  
volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
  opensearch-data: