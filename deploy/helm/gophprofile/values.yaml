# ============================================================
# Образы приложения
# ============================================================
image:
  repository: gophprofile-server
  tag: latest
  pullPolicy: IfNotPresent

workerImage:
  repository: gophprofile-worker
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ============================================================
# Server
# ============================================================
server:
  replicaCount: 2
  containerPort: 8080

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Graceful shutdown
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5

  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

# ============================================================
# Worker
# ============================================================
worker:
  replicaCount: 1
  metricsPort: 8081

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  terminationGracePeriodSeconds: 30

# ============================================================
# Service (ClusterIP)
# ============================================================
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# ============================================================
# Ingress
# ============================================================
ingress:
  enabled: true
  className: nginx
  host: avatars.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  tls:
    enabled: false
    secretName: ""

# ============================================================
# Config (несекретные настройки → ConfigMap, ENV)
# ============================================================
config:
  logLevel: info
  httpAddr: ":8080"
  s3Bucket: "avatars"
  s3UseSSL: "false"
  otelEndpoint: "jaeger-collector.observability.svc.cluster.local:4317"
  # Бизнес-правила загрузки (переопределение дефолтов из кода)
  maxFileSize: "10485760"  # 10 MB в байтах
  allowedMimeTypes: "image/jpeg,image/png,image/webp"

# ============================================================
# Secrets (DSN/пароли → Secret, ENV)
# ВНИМАНИЕ: для прод-деплоя заменить через --set или values-prod.yaml
# ============================================================
secrets:
  dbDsn: "postgres://gophprofile:gophprofile@gophprofile-postgresql:5432/gophprofile?sslmode=disable"
  s3Endpoint: "gophprofile-minio:9000"
  s3AccessKey: "minioadmin"
  s3SecretKey: "minioadmin"
  amqpUrl: "amqp://user:pass@gophprofile-rabbitmq:5672/"

# ============================================================
# Migrate — Helm hook job для миграций БД перед install/upgrade
# ============================================================
migrate:
  enabled: true
  backoffLimit: 3
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
      
# ============================================================
# ServiceAccount
# ============================================================
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ============================================================
# Pod SecurityContext (общий для всех контейнеров пода)
# ============================================================
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# ============================================================
# Container SecurityContext (на уровне контейнера)
# ============================================================
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# ============================================================
# NetworkPolicy
# ============================================================
networkPolicy:
  enabled: true

# ============================================================
# ServiceMonitor (prometheus-operator CRD)
# Включить только если в кластере стоит prometheus-operator
# ============================================================
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  labels: {}

# ============================================================
# Node selection
# ============================================================
nodeSelector: {}
tolerations: []
affinity: {}