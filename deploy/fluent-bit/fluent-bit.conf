[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Tag               docker.*
    Refresh_Interval  5
    Read_from_Head    true
    DB                /var/log/fluentbit.db
    Skip_Long_Lines   On

# Docker пишет свой JSON, внутри поля "log" — исходная строка приложения (тоже JSON).
# Парсим её и раскрываем в отдельные поля.
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        json
    Reserve_Data  On

# Добавляем имя контейнера/сервиса из docker метаданных.
[FILTER]
    Name          modify
    Match         docker.*
    Copy          container_name service

[OUTPUT]
    Name              opensearch
    Match             docker.*
    Host              opensearch
    Port              9200
    Index             gophprofile-logs
    Suppress_Type_Name On
    tls               Off
    Retry_Limit       5